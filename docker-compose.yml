services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      - redis

  agent:
    build: .
    command: python worker.py
    env_file: .env
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      - redis
